<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMI 계산기</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <main class="container">
    <h1>BMI 계산기</h1>
    
    <div class="input-group">
      <label for="height">키 (cm)</label>
      <input type="text" id="height" placeholder="예 : 170">
    </div>

    <div class="input-group">
      <label for="weight">몸무게 (kg)</label>
      <input type="text" id="weigth" placeholder="예 : 70">
    </div>

    <button onclick="calculateBMI()">계산하기</button>

    <!-- 결과 안내 문구 -->
    <div id="result-text" class="result-text hidden">
      당신의 신체질량지수(BMI)는 <span id="bmi-val">0</span> (으)로 
      <span id="state-val">정상</span>입니다. 
      평균체중은 <span id="normal-weight-val">0</span> kg 입니다.
    </div>

    <!-- 6단계 BMI 그래프 바 -->
    <div id="gauge-container" class="gauge-container hidden">
      <div id="arrow" class="arrow">▼</div>
      <div class="bar-wrapper">
        <div class="bar step1">저체중</div>
        <div class="bar step2">정상</div>
        <div class="bar step3">비만전단계</div>
        <div class="bar step4">1단계 비만</div>
        <div class="bar step5">2단계 비만</div>
        <div class="bar step6">3단계 비만</div>
      </div>
      <div class="labels">
        <span>0</span>
        <span>18.5이상</span>
        <span>23이상</span>
        <span>25이상</span>
        <span>30이상</span>
        <span>35이상</span>
      </div>
    </div>
  </main>

  <!-- JavaScript 파일 연동 -->
  <script src="./script.js"></script>
</body>
</html>
